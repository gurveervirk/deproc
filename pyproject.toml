[tool.uv.workspace]
members = [
    "deproc-core",
    "deproc-python",
    "deproc-utils-tree-sitter",
    "deproc-utils-python-env",
    "deproc-java",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["deproc-python", "deproc-core", "deproc-utils-python-env", "deproc-java"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
