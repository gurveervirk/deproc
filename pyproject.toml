[tool.uv.workspace]
members = [
    "deproc-core",
    "deproc-python",
    "deproc-utils-tree-sitter",
    "deproc-utils-python-env",
    "deproc-java",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["deproc-python", "deproc-core", "deproc-utils-python-env", "deproc-utils-tree-sitter", "deproc-java"]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]

[tool.basedpyright]
include = ["deproc-core", "deproc-python", "deproc-java", "deproc-utils-tree-sitter", "deproc-utils-python-env"]
exclude = ["**/tests", "**/.venv"]
extraPaths = ["deproc-core", "deproc-python", "deproc-java", "deproc-utils-tree-sitter", "deproc-utils-python-env"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "basic"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
