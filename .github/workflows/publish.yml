name: publish

on:
  push:
    tags: ['v*']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install
      - run: uv sync
      - run: uv run pytest

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package:
          - { name: deproc-core, path: deproc-core, env: pypi-deproc-core }
          - { name: deproc-python, path: deproc-python, env: pypi-deproc-python }
          - { name: deproc-utils-tree-sitter, path: deproc-utils-tree-sitter, env: pypi-deproc-utils-tree-sitter }
          - { name: deproc-utils-python-env, path: deproc-utils-python-env, env: pypi-deproc-utils-python-env }
    environment:
      name: ${{ matrix.package.env }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install build
      - run: cd ${{ matrix.package.path }} && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.package.path }}/dist
