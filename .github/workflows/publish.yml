name: Publish Package to PyPI

on:
  push:
    tags:
      - '*-v[0-9]*'

jobs:
  extract-package:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.parse.outputs.pkg_name }}
      pkg_dir: ${{ steps.parse.outputs.pkg_dir }}
      changed_since: ${{ steps.previous.outputs.changed_since }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Validate package tag
        id: parse
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          case "$TAG_NAME" in
            deproc-core-v*|deproc-python-v*|deproc-java-v*|deproc-utils-tree-sitter-v*|deproc-utils-python-env-v*)
              ;;
            *)
              echo "Unsupported package tag: $TAG_NAME" >&2
              exit 1
              ;;
          esac
          PKG_NAME="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          python - "$PKG_NAME" "$VERSION" <<'PY'
          import pathlib
          import sys
          import tomllib

          package_name, tag_version = sys.argv[1:]
          metadata_path = pathlib.Path(package_name) / "pyproject.toml"
          project = tomllib.loads(metadata_path.read_text())['project']
          if project['name'] != package_name:
              raise SystemExit(
                  f"Package name mismatch: tag selects {package_name!r}, metadata has {project['name']!r}"
              )
          if project['version'] != tag_version:
              raise SystemExit(
                  f"Version mismatch: tag selects {tag_version!r}, metadata has {project['version']!r}"
              )
          PY
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_dir=$PKG_NAME" >> $GITHUB_OUTPUT
      - name: Find the previous release of the package
        id: previous
        env:
          PKG_NAME: ${{ steps.parse.outputs.pkg_name }}
        run: |
          previous="$(git describe --tags --abbrev=0 --match "${PKG_NAME}-v*" HEAD^ 2>/dev/null || true)"
          if [ -z "$previous" ]; then
            previous=4b825dc642cb6eb9a060e54bf8d69288fbee4904
            echo "No earlier ${PKG_NAME} tag; scanning the whole package."
          else
            echo "Previous ${PKG_NAME} release: $previous"
          fi
          echo "changed_since=$previous" >> "$GITHUB_OUTPUT"

  test:
    needs: extract-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install
      - run: uv sync
      - run: uv run pytest

  provenance:
    needs: extract-package
    uses: ./.github/workflows/code-provenance.yml
    permissions:
      checks: write
      contents: read
      pull-requests: write
    with:
      scan_mode: full
      changed_since: ${{ needs.extract-package.outputs.changed_since }}
      changed_path: ${{ needs.extract-package.outputs.pkg_dir }}
      tolerate_unavailable: true

  publish:
    needs: [extract-package, test, provenance]
    runs-on: ubuntu-latest
    environment: pypi-${{ needs.extract-package.outputs.pkg_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install build
      - run: cd ${{ needs.extract-package.outputs.pkg_dir }} && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.extract-package.outputs.pkg_dir }}/dist
