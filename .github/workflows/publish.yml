name: Publish Package to PyPI

on:
  push:
    tags:
      - '*-v[0-9]*'

jobs:
  extract-package:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.parse.outputs.pkg_name }}
      pkg_dir: ${{ steps.parse.outputs.pkg_dir }}
    steps:
      - name: Parse tag
        id: parse
        run: |
          TAG_NAME="${{ github.ref_name }}"
          PKG_NAME="${TAG_NAME%-v*}"
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_dir=$PKG_NAME" >> $GITHUB_OUTPUT

  test:
    needs: extract-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install
      - run: uv sync
      - run: uv run pytest

  publish:
    needs: [extract-package, test]
    runs-on: ubuntu-latest
    environment: pypi-${{ needs.extract-package.outputs.pkg_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install build
      - run: cd ${{ needs.extract-package.outputs.pkg_dir }} && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.extract-package.outputs.pkg_dir }}/dist
