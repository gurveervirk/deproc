name: Publish Package to PyPI

on:
  push:
    tags:
      - '*-v[0-9]*'

jobs:
  extract-package:
    runs-on: ubuntu-latest
    outputs:
      pkg_name: ${{ steps.parse.outputs.pkg_name }}
      pkg_dir: ${{ steps.parse.outputs.pkg_dir }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - name: Validate package tag
        id: parse
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          case "$TAG_NAME" in
            deproc-core-v*|deproc-python-v*|deproc-java-v*|deproc-utils-tree-sitter-v*|deproc-utils-python-env-v*)
              ;;
            *)
              echo "Unsupported package tag: $TAG_NAME" >&2
              exit 1
              ;;
          esac
          PKG_NAME="${TAG_NAME%-v*}"
          VERSION="${TAG_NAME##*-v}"
          python - "$PKG_NAME" "$VERSION" <<'PY'
          import pathlib
          import sys
          import tomllib

          package_name, tag_version = sys.argv[1:]
          metadata_path = pathlib.Path(package_name) / "pyproject.toml"
          project = tomllib.loads(metadata_path.read_text())['project']
          if project['name'] != package_name:
              raise SystemExit(
                  f"Package name mismatch: tag selects {package_name!r}, metadata has {project['name']!r}"
              )
          if project['version'] != tag_version:
              raise SystemExit(
                  f"Version mismatch: tag selects {tag_version!r}, metadata has {project['version']!r}"
              )
          PY
          echo "pkg_name=$PKG_NAME" >> $GITHUB_OUTPUT
          echo "pkg_dir=$PKG_NAME" >> $GITHUB_OUTPUT

  test:
    needs: extract-package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv python install
      - run: uv sync
      - run: uv run pytest

  publish:
    needs: [extract-package, test]
    runs-on: ubuntu-latest
    environment: pypi-${{ needs.extract-package.outputs.pkg_name }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install build
      - run: cd ${{ needs.extract-package.outputs.pkg_dir }} && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ needs.extract-package.outputs.pkg_dir }}/dist
